name: PR browser tests

on: pull_request

permissions:
  contents: read

jobs:
  browser-tests:
    name: Browser tests
    runs-on: ubuntu-24.04
    steps:
      - name: Check out PR source
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22'

      - name: Install dependencies
        run: npm ci

      - name: Build Chrome MV3 extension
        run: npm run build -- --browser chrome --mv3

      - name: Install Playwright Chromium and system dependencies
        run: npx playwright install --with-deps --no-shell chromium

      - name: Run browser tests
        run: npm run test:browser
